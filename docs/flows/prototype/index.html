<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="color-scheme" content="light" />
  <title>ARCEL Codeworks — D03 clickable flows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=Plus+Jakarta+Sans:wght@560;650;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #191bdf;
      --ink: #111827;
      --muted: #5a6470;
      --pale: #f1f2ff;
      --sidebar: #f7f7f8;
      --line: #e2e3e7;
      --white: #ffffff;
      --radius: 14px;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --warn: #8a5a00;
      --warn-bg: #fff6e5;
      --danger: #9b1c1c;
      --danger-bg: #fdecec;
      --ok: #0f6b3a;
      --ok-bg: #e8f7ee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #eef0f3; color: var(--ink); font: 14px/1.5 Inter, system-ui, sans-serif; }
    button, textarea, input { color: inherit; font: inherit; }
    button { border: 0; background: none; cursor: pointer; }
    button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid rgba(25, 27, 223, .55); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .proto {
      position: sticky; top: 0; z-index: 40;
      display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
      padding: 10px 16px; background: #111827; color: #fff;
    }
    .proto-brand { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .proto-brand b { font: 650 12px "Plus Jakarta Sans", sans-serif; letter-spacing: .02em; }
    .proto-brand span { color: #c5c9d2; font-size: 11px; }
    .flows { display: flex; flex-wrap: wrap; gap: 4px; }
    .flows button {
      height: 28px; padding: 0 9px; border-radius: 7px; color: #d7dbe3; font-size: 11px; font-weight: 600;
    }
    .flows button:hover { background: #2a3140; color: #fff; }
    .flows button.active { background: #191bdf; color: #fff; }
    .screen-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line);
    }
    .chips { display: flex; gap: 4px; }
    .chips button {
      height: 26px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; font-size: 11px; color: var(--muted);
    }
    .chips button.active { border-color: var(--blue); background: var(--pale); color: var(--blue); font-weight: 650; }
    .screen-meta { flex: 1; color: var(--muted); font-size: 12px; }
    .screen-meta strong { color: var(--ink); }
    .nav-btns { display: flex; gap: 6px; }
    .nav-btns button, .ghost, .primary, .chip {
      height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
    }
    .nav-btns button, .ghost { border: 1px solid var(--line); background: #fff; }
    .nav-btns button:hover, .ghost:hover { border-color: #babdc5; }
    .primary { background: var(--blue); color: #fff; }
    .primary:hover { background: #0f10b9; }
    .primary:disabled, .send:disabled { opacity: .5; cursor: default; }

    .app { min-height: calc(100vh - 90px); display: grid; grid-template-columns: 254px minmax(0, 1fr); background: #fff; }
    .sidebar {
      display: flex; flex-direction: column; padding: 16px 12px 12px;
      background: var(--sidebar); border-right: 1px solid #ededee;
    }
    .brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 12px; }
    .brand-mark {
      width: 22px; height: 22px; border-radius: 6px; background: var(--pale); color: var(--blue);
      display: grid; place-items: center; font: 700 11px "Plus Jakarta Sans", sans-serif;
    }
    .brand strong { display: block; font: 700 13px "Plus Jakarta Sans", sans-serif; letter-spacing: -.02em; }
    .brand small { color: var(--muted); font-size: 10px; }
    .new-chat {
      margin: 4px 0 10px; height: 40px; border: 1px solid #d9dade; border-radius: 10px; background: #fff;
      display: flex; align-items: center; gap: 10px; padding: 0 11px; text-align: left; font-weight: 560;
    }
    .new-chat:hover { border-color: #b8bac2; }
    .new-chat kbd { margin-left: auto; color: #989ca4; font-size: 10px; }
    .nav { display: grid; gap: 2px; }
    .nav button, .recent button {
      width: 100%; height: 38px; border-radius: 9px; display: flex; align-items: center; gap: 10px;
      padding: 0 10px; color: #454b55; text-align: left;
    }
    .nav button:hover, .nav button.active, .recent button:hover { background: #ebebed; color: var(--ink); }
    .nav button.active { font-weight: 650; }
    .section { margin-top: 18px; }
    .section > p { margin: 0 0 6px; padding: 0 10px; color: #8b8f97; font-size: 11px; }
    .account {
      margin-top: auto; padding-top: 12px; border-top: 1px solid #e4e4e6;
      display: grid; grid-template-columns: 31px 1fr auto; gap: 8px; align-items: center;
    }
    .avatar { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; font-size: 10px; }
    .account strong { display: block; font-size: 12px; }
    .account small { color: #8a8f97; font-size: 10px; }
    .acct-menu {
      position: relative;
    }
    .acct-pop {
      position: absolute; left: 0; bottom: 36px; width: 210px; padding: 6px;
      border: 1px solid #d9dade; border-radius: 12px; background: #fff;
      box-shadow: 0 14px 36px rgba(17, 24, 39, .13); z-index: 20;
    }
    .acct-pop button { width: 100%; height: 36px; border-radius: 8px; padding: 0 10px; text-align: left; }
    .acct-pop button:hover { background: #f4f4f5; }

    .workspace { min-width: 0; display: grid; grid-template-rows: auto 1fr auto; }
    .workspace.split { grid-template-columns: minmax(0, 1fr) minmax(280px, 42%); }
    .workspace.split .thread-wrap, .workspace.split .composer-dock { grid-column: 1; }
    .workspace.split .panel { grid-column: 2; grid-row: 1 / span 3; }

    .topbar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #f0f0f2; }
    .intel {
      display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 8px; font: 650 13px "Plus Jakarta Sans", sans-serif;
    }
    .intel:hover { background: #f3f3f4; }
    .stage { min-height: 0; overflow: auto; }
    .home { min-height: 100%; display: grid; place-items: center; padding: 36px 24px 40px; }
    .welcome { width: min(760px, 100%); text-align: center; }
    .welcome h1 { margin: 0; font: 650 clamp(28px, 4vw, 36px)/1.15 "Plus Jakarta Sans", sans-serif; letter-spacing: -.035em; }
    .welcome > p { margin: 8px 0 24px; color: var(--muted); }
    .suggestions { margin-top: 14px; display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; }
    .suggestions button {
      height: 32px; padding: 0 12px; border: 1px solid #e1e2e5; border-radius: 99px; color: #676d76; background: #fff; font-size: 12px;
    }
    .suggestions button:hover { border-color: #c5c7cd; color: var(--ink); }

    .thread-wrap { padding: 24px 24px 12px; }
    .thread { width: min(760px, 100%); margin: 0 auto; display: grid; gap: 22px; }
    .msg-user { display: flex; justify-content: flex-end; }
    .msg-user > div { max-width: 78%; padding: 11px 15px; border-radius: 18px 18px 4px 18px; background: #f0f0f2; }
    .msg-ai { display: grid; grid-template-columns: 29px 1fr; gap: 12px; }
    .mark { width: 29px; height: 29px; border-radius: 8px; display: grid; place-items: center; background: var(--pale); color: var(--blue); font: 700 11px "Plus Jakarta Sans", sans-serif; }
    .msg-ai .body p { margin: 2px 0 0; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .actions button {
      height: 28px; padding: 0 8px; border-radius: 7px; color: #5c6370; font-size: 11px;
    }
    .actions button:hover { background: #f2f2f3; color: var(--ink); }
    .sources { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
    .sources button {
      max-width: 220px; height: 34px; border: 1px solid var(--line); border-radius: 9px;
      display: flex; align-items: center; gap: 7px; padding: 0 9px; font-size: 11px; background: #fff;
    }
    .sources b { width: 17px; height: 17px; border-radius: 5px; display: grid; place-items: center; background: var(--pale); color: var(--blue); font-size: 9px; }
    .thinking { display: flex; gap: 5px; align-items: center; height: 28px; }
    .thinking i { width: 5px; height: 5px; border-radius: 50%; background: #8e9299; animation: pulse 1.2s infinite; }
    .thinking i:nth-child(2) { animation-delay: .15s; }
    .thinking i:nth-child(3) { animation-delay: .3s; }

    .composer-dock { padding: 8px 24px 16px; }
    .composer {
      width: min(760px, 100%); margin: 0 auto; border: 1px solid #d7d8dc; border-radius: 20px; padding: 12px;
      background: #fff; box-shadow: 0 8px 26px rgba(17, 24, 39, .07);
    }
    .composer textarea { width: 100%; min-height: 56px; resize: none; border: 0; outline: 0; background: transparent; padding: 4px; font-size: 15px; }
    .composer-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .composer-bar > div { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .icon-btn { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #656b75; }
    .icon-btn:hover, .icon-btn.on { background: #f1f1f3; color: var(--ink); }
    .icon-btn.on { color: var(--blue); background: var(--pale); }
    .tool-chip {
      height: 26px; padding: 0 8px; border-radius: 99px; background: var(--pale); color: var(--blue); font-size: 11px; font-weight: 650;
    }
    .send { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-size: 13px; }
    .hint { margin: 6px 0 0; text-align: center; color: #969aa2; font-size: 11px; }

    .panel {
      border-left: 1px solid var(--line); background: #fafafa; display: flex; flex-direction: column; min-height: 100%;
    }
    .panel header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .panel header strong { font: 650 13px "Plus Jakarta Sans", sans-serif; }
    .panel .content { padding: 16px; overflow: auto; }
    .doc {
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-height: 240px;
    }
    .doc h3 { margin: 0 0 8px; font: 650 16px "Plus Jakarta Sans", sans-serif; }
    .doc p.sel { background: #eef0ff; outline: 1px solid rgba(25, 27, 223, .25); border-radius: 6px; padding: 6px; cursor: pointer; }
    .versions { display: grid; gap: 6px; margin-top: 12px; }
    .versions button { text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 12px; }
    .versions button.active { border-color: var(--blue); background: var(--pale); }

    .banner { width: min(760px, 100%); margin: 0 auto 12px; padding: 12px 14px; border-radius: 12px; }
    .banner.quota { background: var(--warn-bg); color: var(--warn); }
    .banner.danger { background: var(--danger-bg); color: var(--danger); }
    .banner.ok { background: var(--ok-bg); color: var(--ok); }
    .banner.muted { background: #f3f4f6; color: #3f4650; }
    .banner strong { display: block; margin-bottom: 4px; }
    .banner .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .card-list { width: min(720px, 100%); margin: 24px auto; display: grid; gap: 10px; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #fff; text-align: left; }
    .card h2 { margin: 0 0 6px; font: 650 16px "Plus Jakarta Sans", sans-serif; }
    .file { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f2; }
    .file:last-child { border-bottom: 0; }
    .pill { padding: 2px 7px; border-radius: 99px; font-size: 10px; font-weight: 650; }
    .pill.ready { background: var(--ok-bg); color: var(--ok); }
    .pill.partial { background: var(--warn-bg); color: var(--warn); }
    .pill.failed { background: var(--danger-bg); color: var(--danger); }
    .pill.load { background: var(--pale); color: var(--blue); }

    .picker, .overlay {
      position: fixed; z-index: 30; border: 1px solid #d9dade; border-radius: 12px; background: #fff;
      box-shadow: 0 16px 40px rgba(17, 24, 39, .14);
    }
    .picker { width: min(420px, calc(100vw - 24px)); padding: 8px; }
    .picker p, .overlay p.k { margin: 6px 10px 8px; color: #8b8f97; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
    .picker button.row, .model-row {
      width: 100%; min-height: 52px; border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 8px; text-align: left;
    }
    .picker button.row:hover, .model-row:hover, .model-row.active { background: #f4f4f5; }
    .model-row small, .picker small { color: #8b8f97; font-size: 11px; }
    .effort { display: flex; gap: 4px; padding: 4px 10px 10px; }
    .effort button { height: 28px; padding: 0 10px; border-radius: 7px; background: #f3f3f4; font-size: 11px; }
    .effort button.active { background: #fff; box-shadow: 0 1px 4px rgba(17, 24, 39, .08); font-weight: 650; }
    .backdrop { position: fixed; inset: 0; background: rgba(17, 24, 39, .28); z-index: 25; }
    .sheet {
      position: fixed; left: 50%; top: 12vh; transform: translateX(-50%); width: min(560px, calc(100% - 32px));
      z-index: 30; background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 22px 70px rgba(17, 24, 39, .2);
    }
    .sheet h2 { margin: 0 0 8px; font: 650 20px "Plus Jakarta Sans", sans-serif; }
    .rec { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #e11; box-shadow: 0 0 0 4px rgba(225, 17, 17, .15); }
    .progress { height: 6px; border-radius: 99px; background: #ececf0; overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 62%; background: var(--blue); }

    .lib { width: min(880px, calc(100% - 40px)); margin: 28px auto 60px; }
    .lib h1 { margin: 0; font: 650 28px "Plus Jakarta Sans", sans-serif; }
    .lib > p { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 16px; }

    @keyframes pulse { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .workspace.split { grid-template-columns: 1fr; }
      .workspace.split .panel { grid-column: 1; grid-row: auto; border-left: 0; border-top: 1px solid var(--line); min-height: 280px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="proto">
    <div class="proto-brand">
      <b>D03 · Clickable flows</b>
      <span>General-purpose only · PRD §5 / §3 / §6 / §8 · R0 · not production</span>
    </div>
    <nav class="flows" id="flow-tabs" aria-label="Flows"></nav>
  </div>
  <div class="screen-row">
    <div class="chips" id="screen-chips"></div>
    <div class="screen-meta" id="screen-meta"></div>
    <div class="nav-btns">
      <button type="button" id="prev">← Prev</button>
      <button type="button" id="next">Next →</button>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <strong>ARCEL</strong>
          <small>Codeworks · Your AI workspace</small>
        </div>
      </div>
      <button class="new-chat" data-go="A1">＋ New chat <kbd>⌘ K</kbd></button>
      <nav class="nav">
        <button type="button" data-ia="search">⌕ Search history</button>
        <button type="button" data-ia="projects" id="nav-projects">Projects</button>
        <button type="button" data-ia="library" id="nav-library">Library</button>
        <button type="button" data-ia="tasks" id="nav-tasks">Tasks</button>
      </nav>
      <section class="section">
        <p>Recent</p>
        <div class="recent">
          <button type="button" data-go="A3">Explain transformers simply</button>
          <button type="button" data-go="C2">Diff two vendor PDFs</button>
          <button type="button" data-go="D2">Cited product comparison</button>
        </div>
      </section>
      <div class="account">
        <span class="avatar">SM</span>
        <div><strong>Swapnil</strong><small>Personal · Trial</small></div>
        <div class="acct-menu">
          <button type="button" id="acct-toggle" aria-expanded="false" aria-haspopup="true">···</button>
          <div class="acct-pop" id="acct-pop" hidden>
            <button type="button" data-ia="models">Models</button>
            <button type="button" data-ia="connections">Connections</button>
            <button type="button" data-ia="usage">Usage</button>
            <button type="button" data-ia="privacy">Privacy</button>
            <button type="button" data-ia="settings">Settings</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="workspace" id="workspace"></div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div id="float"></div>

  <script>
    const FLOWS = [
      { id: "A", name: "First chat", screens: ["A1", "A2", "A3"] },
      { id: "B", name: "Model", screens: ["B1", "B2"] },
      { id: "C", name: "Files", screens: ["C1", "C2"] },
      { id: "D", name: "Research", screens: ["D1", "D2"] },
      { id: "E", name: "Artifact", screens: ["E1"] },
      { id: "F", name: "Voice", screens: ["F1"] },
      { id: "G", name: "Quota/Errors", screens: ["G1"] }
    ];
    const ORDER = FLOWS.flatMap(f => f.screens);
    const META = {
      A1: "Empty home — composer first, general examples, no AEC / project / model required",
      A2: "Streaming reply — Stop marks output partial; no private chain-of-thought",
      A3: "Response actions — Copy, save, artifact, retry, Details (actual model)",
      B1: "Auto · Standard — effort Quick / Standard / Deep; tools stay separate",
      B2: "Choose model — curated catalog; lock named model or return to Auto",
      C1: "Upload states — Ready / Partial / Failed before the model can use a file",
      C2: "Cited pages — locators open the original revision in the source panel",
      D1: "Research plan — scope, estimate, confirm when outside allowance",
      D2: "Async report — cancel / reopen; methodology + substantiated source count",
      E1: "Artifact panel — select-revise; restore creates a new version",
      F1: "Voice — visible recording, editable transcript, continue in the same thread",
      G1: "Quota & errors — distinct banners; no automatic overage"
    };

    const MODELS = [
      { id: "auto", name: "Auto", pub: "ARCEL routing", meta: "Selects third-party models in policy. Not an ARCEL-trained foundation model.", cost: "—" },
      { id: "fast", name: "Atlas Fast", pub: "OpenAI", meta: "Everyday Q&A and short rewrites · text · low latency", cost: "$" },
      { id: "balanced", name: "Helix Balanced", pub: "Anthropic", meta: "Default writing, files, tools · text + image in", cost: "$$" },
      { id: "deep", name: "Keystone Reason", pub: "xAI", meta: "Hard analysis and planning · tools · slower", cost: "$$$" },
      { id: "code", name: "Rivets Code", pub: "Anthropic", meta: "Generation and repair · sandbox tools", cost: "$$" },
      { id: "long", name: "Wide Context", pub: "Google", meta: "Long docs and visual inputs · 1M-class context", cost: "$$" },
      { id: "alt", name: "Second Opinion", pub: "OpenAI", meta: "Independent family for a deliberate second pass", cost: "$$" }
    ];

    const state = {
      screen: "A1",
      prompt: "",
      effort: "Standard",
      model: "auto",
      locked: false,
      tools: [],
      menu: null,
      ia: null,
      recording: false,
      transcript: "",
      selectedPara: false,
      version: "v3",
      fileRetry: false,
      errorKind: "quota"
    };

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));

    function go(id) {
      if (!ORDER.includes(id)) return;
      state.screen = id;
      state.menu = null;
      if (id !== "F1") state.recording = false;
      closeFloat();
      render();
    }
    function flowOf(id) { return FLOWS.find(f => f.screens.includes(id)); }
    function shift(delta) {
      const i = ORDER.indexOf(state.screen);
      go(ORDER[Math.max(0, Math.min(ORDER.length - 1, i + delta))]);
    }

    function composer({ streaming = false, placeholder = "Message Codeworks…" } = {}) {
      const intel = state.locked
        ? `${MODELS.find(m => m.id === state.model)?.name || "Named"} · ${state.effort}`
        : `Auto · ${state.effort}`;
      const chips = state.tools.map(t => `<button type="button" class="tool-chip" data-action="remove-tool" data-tool="${esc(t)}">${esc(t)} ×</button>`).join("");
      return `
        <section class="composer">
          <textarea id="prompt" placeholder="${esc(placeholder)}" aria-label="Message Codeworks">${esc(state.prompt)}</textarea>
          <div class="composer-bar">
            <div>
              <button type="button" class="icon-btn" data-action="attach" aria-label="Attach" title="Attach">📎</button>
              <button type="button" class="icon-btn ${state.menu === "tools" ? "on" : ""}" data-action="tools" aria-label="Tools" title="Tools">⚒</button>
              <button type="button" class="icon-btn ${state.recording ? "on" : ""}" data-action="mic" aria-label="Microphone" title="Mic">🎙</button>
              ${chips}
              <button type="button" class="ghost" data-action="intel" aria-label="Intelligence and effort">${esc(intel)}</button>
            </div>

    function persistPrompt() {

    function bind() {
      document.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => {

      document.querySelectorAll("[data-suggest]").forEach(el => el.addEventListener("click", () => {
        state.prompt = el.dataset.suggest;
        state.ia = null;
        go("A2");

        render();

        state.model = el.dataset.lock;
        state.locked = true;
        state.menu = null;
        go("A3");
      }));

        if (t === "Deep research") go("D1");
        else if (t === "Analyze data") go("C1");
        else render();
      }));
      document.querySelectorAll("[data-error]").forEach(el => el.addEventListener("click", () => {
        state.errorKind = el.dataset.error;
        render();
      }));
      document.querySelectorAll("[data-ver]").forEach(el => el.addEventListener("click", () => {

        render();
      }));

    $("flow-tabs").addEventListener("click", e => {

      persistPrompt();
      state.ia = null;
      go(FLOWS.find(f => f.id === b.dataset.flow).screens[0]);
    });
    $("prev").addEventListener("click", () => { persistPrompt(); state.ia = null; shift(-1); });
    $("next").addEventListener("click", () => { persistPrompt(); state.ia = null; shift(1); });
    $("acct-toggle").addEventListener("click", e => {
      e.stopPropagation();
      const open = $("acct-pop").hidden;
      $("acct-pop").hidden = !open;
      $("acct-toggle").setAttribute("aria-expanded", String(open));
    });
    document.querySelector(".sidebar").addEventListener("click", e => {
      const ia = e.target.closest("[data-ia]");
      if (!ia) return;
      const kind = ia.dataset.ia;
      if (["projects", "library", "tasks"].includes(kind)) {
        state.ia = state.ia === kind ? null : kind;

        render();
        return;
      }
      $("acct-pop").hidden = true;

    $("backdrop").addEventListener("click", () => {
      state.menu = null;

    document.body.addEventListener("click", e => {
      const t = e.target.closest("[data-action]");
      if (!t) return;
      const action = t.dataset.action;
      persistPrompt();
      if (action === "close") { state.menu = null; closeFloat(); return; }

        state.ia = null;
        if (state.screen === "A1" || state.screen === "B1") go("A2");
        else if (state.screen === "C1") go("C2");
        else if (state.screen === "F1" && (state.transcript || state.prompt)) { state.transcript = state.prompt || state.transcript; go("F1"); render(); }
        else go("A3");
        return;
      }
      if (action === "stop") { go("A3"); return; }
      if (action === "attach") { state.ia = null; go("C1"); return; }
      if (action === "tools") { state.menu = "tools"; openTools(t); return; }
      if (action === "intel") { state.menu = "intel"; openIntel(t); return; }
      if (action === "mic") {
        state.ia = null;
        go("F1");
        state.recording = !state.recording;
        if (!state.recording && !state.transcript) {
          state.transcript = "";
          state.prompt = "Can you keep going in text from what I just said about transformer attention?";
        }
        if (state.recording) state.prompt = "";
        render();
        return;
      }
      if (action === "remove-tool") {
        state.tools = state.tools.filter(x => x !== t.dataset.tool);
        render();
        return;
      }
      if (action === "use-auto") {
        state.locked = false;
        state.model = "auto";
        state.menu = null;
        closeFloat();
        go("B1");
        return;
      }
      if (action === "details") {
        openSheet("models");
        $("float").innerHTML = `<div class="sheet"><h2>Run details</h2>
          <p>Model: ${state.locked ? esc(MODELS.find(m => m.id === state.model).name) : "Helix Balanced (Auto)"} · Publisher: Anthropic · Effort: ${esc(state.effort)} · Tools: ${state.tools.join(", ") || "none"} · Duration: 3.1s · Usage: 1.2k in / 420 out</p>
          <div class="actions"><button type="button" class="ghost" data-action="close">Close</button></div></div>`;
        return;
      }
      if (action === "copy" || action === "save") {
        t.textContent = action === "copy" ? "Copied" : "Saved to project";
        return;
      }
      if (action === "retry-file") { state.fileRetry = true; render(); return; }
      if (action === "select-para") { state.selectedPara = true; render(); return; }
      if (action === "revise") {
        state.version = "v4";
        state.selectedPara = false;
        render();
        return;
      }
      if (action === "restore") { state.version = "v4"; render(); return; }
      if (action === "cheaper") { state.effort = "Quick"; state.locked = false; state.model = "auto"; go("A1"); return; }
    });

    render();
  </script>
</body>
</html>
