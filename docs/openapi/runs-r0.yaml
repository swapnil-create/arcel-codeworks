openapi: 3.1.0
info:
  title: ARCEL CodeWorks Run API (R0 draft)
  version: 0.0.0-r0-draft
  x-status: draft-not-implemented
  description: |
    **Documentation only. No server implements these endpoints.**

    This is the CodeWorks-owned public contract for creating and observing agent
    runs. It is a draft for review — the core team owns the adapter, worker,
    queue, production database, authorization, budget enforcement, and connector
    execution. Nothing here is wired to a live service, and nothing here may be
    called from browser code until the real Run API exists.

    Identifiers are CodeWorks-owned and opaque (`run_`, `proj_`, `wf_`, `apr_`,
    `tool_`, `msg_`, `use_`). Internal harness / Hermes identifiers are **never**
    exposed as public identifiers and must not appear in any request or response.

    Event bodies follow the versioned RunEvent contract in
    `docs/data-model/schemas/run-event*.schema.json` (see `docs/data-model/RUN-EVENTS.md`).
servers:
  - url: https://arcel-codeworks.vercel.app
    description: Public origin (Run API not yet mounted)
security:
  - cookieAuth: []
tags:
  - name: runs
    description: Create and observe runs
  - name: approvals
    description: Approve or reject checkpoints for model-changing actions
  - name: catalog
    description: Models and usage
paths:
  /v1/runs:
    post:
      tags: [runs]
      summary: Create a run
      operationId: createRun
      description: |
        Creates a run. Requires an `Idempotency-Key` header; replaying the same key
        with the same body returns the original run, while reusing it with a
        different body is an `IDEMPOTENCY_CONFLICT`. The caller supplies project,
        workflow, model selection, and a maximum budget. Spend authorization is
        derived from the signed session only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '201':
          description: Run accepted (queued).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '402':
          $ref: '#/components/responses/BudgetExceeded'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /v1/runs/{run_id}/events:
    get:
      tags: [runs]
      summary: Stream/replay run events
      operationId: getRunEvents
      description: |
        Returns an ordered page of RunEvents for a run. Use `cursor` to resume: an
        empty `cursor` starts from `seq` 1; the response `next_cursor` is opaque and
        should be passed back verbatim to fetch the next page. `seq` is strictly
        increasing, so a client can dedupe and resume after a disconnect. When
        `next_cursor` is null the caller has reached the current end of the stream;
        for a non-terminal run it may poll again with the same cursor.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: cursor
          in: query
          required: false
          description: Opaque resume cursor from a prior `next_cursor`. Omit to start at the beginning.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum events to return in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: A page of run events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventPage'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RunNotFound'
  /v1/runs/{run_id}/approvals/{approval_id}/approve:
    post:
      tags: [approvals]
      summary: Approve a model-changing checkpoint
      operationId: approveRunCheckpoint
      description: |
        Approves the checkpoint referenced by `approval_id`. The caller must echo the
        `payload_hash` from the `approval.required` event; a mismatch (for example if
        the underlying tool arguments changed) is rejected and the model-changing
        action does not proceed.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Approval recorded; the gated action may proceed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/ApprovalRequired'
  /v1/runs/{run_id}/approvals/{approval_id}/reject:
    post:
      tags: [approvals]
      summary: Reject a model-changing checkpoint
      operationId: rejectRunCheckpoint
      description: |
        Rejects the checkpoint. The gated model-changing action does not run; the run
        continues along its no-write path or terminates per the workflow.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRejection'
      responses:
        '200':
          description: Rejection recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RunNotFound'
  /v1/runs/{run_id}/cancel:
    post:
      tags: [runs]
      summary: Cancel a run
      operationId: cancelRun
      description: |
        Requests cancellation. The run moves toward a terminal `cancelled` state;
        already-terminal runs return their current state unchanged.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Cancellation acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RunNotFound'
  /v1/models:
    get:
      tags: [catalog]
      summary: List available models
      operationId: listModels
      description: |
        Returns the public model catalog available to the signed-in principal. Model
        identifiers are CodeWorks-facing slugs; upstream provider/Hermes identifiers
        are not exposed.
      responses:
        '200':
          description: Model catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/AuthRequired'
  /v1/usage:
    get:
      tags: [catalog]
      summary: Get usage summary
      operationId: getUsage
      description: |
        Returns a usage summary in abstract units for the signed-in principal's
        workspace. No provider cost secrets or billing identifiers are returned.
      parameters:
        - name: run_id
          in: query
          required: false
          description: Optional filter to a single run.
          schema:
            type: string
            pattern: '^run_'
      responses:
        '200':
          description: Usage summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: arcel_session
      description: HttpOnly signed session cookie. Identity is server-derived; client-asserted names are ignored.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key (>= 8 chars). Same key + same body replays the original run; same key + different body is an IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 8
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^run_'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^apr_'
  schemas:
    RunRequest:
      type: object
      additionalProperties: false
      required: [project_ref, workflow_ref, model_selection, max_budget_units]
      properties:
        project_ref:
          type: string
          pattern: '^proj_'
        workflow_ref:
          type: string
          pattern: '^wf_'
        model_selection:
          $ref: '#/components/schemas/ModelSelection'
        max_budget_units:
          type: integer
          minimum: 0
          description: Hard ceiling in abstract budget units for this run.
    ModelSelection:
      type: object
      additionalProperties: false
      required: [mode, effort]
      properties:
        mode:
          type: string
          enum: [auto, named]
        effort:
          type: string
          enum: [quick, standard, deep]
        named_model_id:
          type: [string, 'null']
          description: Public model slug (from GET /v1/models). Not a provider/Hermes id.
    Run:
      type: object
      required: [id, status, task_type, attempt, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^run_'
        status:
          type: string
          enum: [queued, running, awaiting_approval, cancelling, completed, failed, cancelled]
        task_type:
          type: string
          enum: [chat, compare, research, code]
        attempt:
          type: integer
          minimum: 1
        parent_run_id:
          type: [string, 'null']
        partial_content:
          type: boolean
        error:
          $ref: '#/components/schemas/RunError'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        terminal_at:
          type: [string, 'null']
          format: date-time
    RunError:
      type: [object, 'null']
      properties:
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
        code:
          type: string
        retryable:
          type: boolean
        request_id:
          type: [string, 'null']
    RunEventPage:
      type: object
      required: [events, next_cursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor for the next page, or null at the current end of stream.
    RunEvent:
      type: object
      description: |
        Versioned run-event envelope. Canonical schema lives in
        docs/data-model/schemas/run-event.schema.json; typed payloads are in
        run-event-*.schema.json. Payloads never carry provider secrets or raw
        connector credentials.
      required: [version, run_id, seq, occurred_at, type, payload]
      properties:
        version:
          type: string
          enum: [r0]
        run_id:
          type: string
          pattern: '^run_'
        seq:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - run.started
            - message.delta
            - tool.requested
            - tool.completed
            - approval.required
            - usage.updated
            - run.completed
            - run.failed
            - run.cancelled
        payload:
          type: object
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [payload_hash]
      properties:
        payload_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Must match the hash from the approval.required event.
        note:
          type: string
    ApprovalRejection:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    Approval:
      type: object
      required: [approval_id, run_id, tool_call_id, status]
      properties:
        approval_id:
          type: string
          pattern: '^apr_'
        run_id:
          type: string
          pattern: '^run_'
        tool_call_id:
          type: string
          pattern: '^tool_'
        status:
          type: string
          enum: [pending, approved, rejected]
        payload_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    CancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: object
            required: [id, tier]
            properties:
              id:
                type: string
                description: Public model slug. Not a provider/Hermes identifier.
              tier:
                type: string
                enum: [quick, standard, deep]
              display_name:
                type: string
    UsageSummary:
      type: object
      required: [workspace_ref, reserved_units, settled_units]
      properties:
        workspace_ref:
          type: string
          pattern: '^ws_'
        run_ref:
          type: [string, 'null']
          pattern: '^run_'
        reserved_units:
          type: integer
          minimum: 0
        settled_units:
          type: integer
          minimum: 0
        released_units:
          type: integer
          minimum: 0
    Taxonomy:
      type: string
      enum:
        - auth_required
        - permission_denied
        - invalid_input
        - unsupported_capability
        - quota_exceeded
        - provider_unavailable
        - rate_limited
        - content_blocked
        - tool_failed
        - context_limit
        - cancelled
    Error:
      type: object
      required: [error, code, taxonomy, retryable]
      properties:
        error:
          type: string
          description: Human-readable message. Never assistant/model output.
        code:
          type: string
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
        retryable:
          type: boolean
        request_id:
          type: [string, 'null']
  responses:
    InvalidInput:
      description: The request could not be accepted (INVALID_INPUT).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: The request could not be accepted.
            code: INVALID_INPUT
            taxonomy: invalid_input
            retryable: false
            request_id: req_0000000000000000
    AuthRequired:
      description: No valid signed session (AUTH_REQUIRED). Unauthenticated requests cannot create or read runs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Sign-in required.
            code: AUTH_REQUIRED
            taxonomy: auth_required
            retryable: false
            request_id: req_0000000000000000
    PermissionDenied:
      description: The signed principal cannot access this object (PERMISSION_DENIED). Guessed IDs and revoked memberships fail closed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Access denied.
            code: PERMISSION_DENIED
            taxonomy: permission_denied
            retryable: false
            request_id: req_0000000000000000
    BudgetExceeded:
      description: The run would exceed its maximum budget (BUDGET_EXCEEDED). No spend occurs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: This run would exceed its maximum budget.
            code: BUDGET_EXCEEDED
            taxonomy: quota_exceeded
            retryable: false
            request_id: req_0000000000000000
    ApprovalRequired:
      description: A model-changing action needs approval, or the echoed payload_hash did not match (APPROVAL_REQUIRED). The action does not proceed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: This action requires an approved checkpoint.
            code: APPROVAL_REQUIRED
            taxonomy: permission_denied
            retryable: false
            request_id: req_0000000000000000
    IdempotencyConflict:
      description: The Idempotency-Key was reused with a different request body (IDEMPOTENCY_CONFLICT).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: This idempotency key was already used with a different request.
            code: IDEMPOTENCY_CONFLICT
            taxonomy: invalid_input
            retryable: false
            request_id: req_0000000000000000
    RunNotFound:
      description: No run is visible to the signed principal for this id (RUN_NOT_FOUND). Unknown and unauthorized ids are indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Run not found.
            code: RUN_NOT_FOUND
            taxonomy: invalid_input
            retryable: false
            request_id: req_0000000000000000
